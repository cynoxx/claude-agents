name: finance-agent

on:
  pull_request:
    paths: ['finance-agent/**', '.github/workflows/finance-agent.yml']
  push:
    branches: [main]
    paths: ['finance-agent/**']

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-agent/server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U finance" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finance-agent/server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:coverage

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-agent/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finance-agent/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
