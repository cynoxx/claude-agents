<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Max est ouvert ailleurs</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #0b2236, #02060c 70%);
        color: #bfe9ff; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center;
      }
      .noyau {
        width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 50%;
        background: radial-gradient(circle, #ffd28a, #ff8a2a 45%, transparent 70%);
        box-shadow: 0 0 40px #ff9a3c88, 0 0 0 1px #56c8ff55, 0 0 0 14px #56c8ff11; animation: pouls 2.4s ease-in-out infinite;
      }
      @keyframes pouls { 50% { transform: scale(0.88); opacity: 0.7; } }
      h1 { margin: 0 0 6px; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; color: #e6f7ff; }
      p { margin: 0 0 22px; color: #7fb4d1; }
      button {
        padding: 10px 18px; border: 1px solid #56c8ff88; border-radius: 999px; background: #56c8ff14; color: #e6f7ff;
        font: inherit; cursor: pointer;
      }
      button:hover { background: #56c8ff2a; }
    </style>
  </head>
  <body>
    <main>
      <div class="noyau" aria-hidden="true"></div>
      <h1>Max est ouvert ailleurs</h1>
      <p>Il s'est ouvert dans une autre fenêtre : celle-ci est en pause (la caméra est libérée).</p>
      <button onclick="location.replace('/')">Ramener Max ici</button>
    </main>
  </body>
</html>
